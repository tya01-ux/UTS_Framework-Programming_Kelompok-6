$kind: http-request
url: "{{baseUrl}}/projects/{{projectId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "completed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Status berubah", function(){ pm.expect(pm.response.json().status).to.eql("completed"); });
    language: text/javascript
order: 4000
