$kind: http-request
url: "{{baseUrl}}/project-members/{{projectMemberId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "member"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Role berubah", function(){ pm.expect(pm.response.json().role).to.eql("member"); });
    language: text/javascript
order: 4000
