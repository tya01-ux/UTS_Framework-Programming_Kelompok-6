$kind: http-request
url: "{{baseUrl}}/tasks/{{taskId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "in_progress"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Status berubah", function(){ pm.expect(pm.response.json().status).to.eql("in_progress"); });
    language: text/javascript
order: 4000
