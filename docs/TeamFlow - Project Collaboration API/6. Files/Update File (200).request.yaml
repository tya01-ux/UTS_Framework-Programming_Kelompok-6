$kind: http-request
url: "{{baseUrl}}/files/{{fileId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "laporan_final.pdf"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      pm.test("Nama berubah", function(){ pm.expect(pm.response.json().name).to.eql("laporan_final.pdf"); });
    language: text/javascript
order: 4000
