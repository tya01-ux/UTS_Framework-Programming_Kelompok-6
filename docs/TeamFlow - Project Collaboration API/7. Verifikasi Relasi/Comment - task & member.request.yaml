$kind: http-request
name: Comment -> task & member
url: "{{baseUrl}}/comments/{{commentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () { pm.response.to.have.status(200); });
      const c = pm.response.json();
      pm.test("Punya task dan member", function(){ pm.expect(c).to.have.property("task"); pm.expect(c).to.have.property("member"); });
    language: text/javascript
order: 3000
