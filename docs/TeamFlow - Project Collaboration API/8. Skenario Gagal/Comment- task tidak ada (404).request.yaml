$kind: http-request
name: "Comment: task tidak ada (404)"
url: "{{baseUrl}}/comments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "task_id": 999999,
      "member_id": {{memberId}},
      "content": "X"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 18000
