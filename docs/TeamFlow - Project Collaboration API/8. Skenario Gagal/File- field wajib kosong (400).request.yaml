$kind: http-request
name: "File: field wajib kosong (400)"
url: "{{baseUrl}}/files"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "project_id": {{projectId}},
      "member_id": {{memberId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 21000
