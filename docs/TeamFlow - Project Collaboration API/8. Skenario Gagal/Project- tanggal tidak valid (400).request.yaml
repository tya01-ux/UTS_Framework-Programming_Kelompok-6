$kind: http-request
name: "Project: tanggal tidak valid (400)"
url: "{{baseUrl}}/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "X",
      "status": "active",
      "start_date": "bukan-tanggal"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 8000
