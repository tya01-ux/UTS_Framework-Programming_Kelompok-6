$kind: http-request
name: "ProjectMember: project tidak ada (404)"
url: "{{baseUrl}}/project-members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "project_id": 999999,
      "member_id": {{memberId}},
      "role": "member"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 404", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 12000
